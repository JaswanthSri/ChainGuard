<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainGuard | Cold-Chain Logistics Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        // --- CONFIGURATION ---
        // TODO: Replace with your actual API Gateway Deployment Invoke URL
        const API_BASE_URL = "https://m6jknkyx57.execute-api.ap-south-1.amazonaws.com/prod";

        async function fetchDashboardData() {
            try {
                // Fetch Trucks State
                const trucksRes = await fetch(`${API_BASE_URL}/trucks`);
                const trucks = await trucksRes.json();
                
                // Fetch Active Alerts
                const alertsRes = await fetch(`${API_BASE_URL}/alerts`);
                const alerts = await alertsRes.json();

                renderMetrics(trucks, alerts);
                renderTrucksTable(trucks);
                renderAlertsStream(alerts);
            } catch (err) {
                console.error("Failed syncing dashboard components:", err);
            }
        }

        function renderMetrics(trucks, alerts) {
            document.getElementById('total-trucks').innerText = trucks.length;
            
            const criticalTrucks = trucks.filter(t => t.status === 'CRITICAL').length;
            document.getElementById('critical-count').innerText = criticalTrucks;
            
            const criticalCard = document.getElementById('critical-card');
            if (criticalTrucks > 0) {
                criticalCard.className = "bg-red-950/40 border border-red-800 p-6 rounded-xl shadow-lg";
            } else {
                criticalCard.className = "bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-lg";
            }
        }

        function renderTrucksTable(trucks) {
            const container = document.getElementById('trucks-grid');
            if(trucks.length === 0) {
                container.innerHTML = `<div class="col-span-full text-zinc-500 py-6 text-center">No active vehicles broadcasting telemetry.</div>`;
                return;
            }
            
            container.innerHTML = trucks.map(truck => {
                let statusBadge = `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium tracking-wide">NORMAL</span>`;
                let borderTheme = "border-zinc-800 bg-zinc-900/60";
                
                if (truck.status === 'CRITICAL') {
                    statusBadge = `<span class="bg-red-950 text-red-400 border border-red-800 text-xs px-2.5 py-1 rounded-full font-medium tracking-wide animate-pulse">CRITICAL</span>`;
                    borderTheme = "border-red-900 bg-red-950/20";
                } else if (truck.status === 'WARNING') {
                    statusBadge = `<span class="bg-amber-950 text-amber-400 border border-amber-800 text-xs px-2.5 py-1 rounded-full font-medium tracking-wide">WARNING</span>`;
                    borderTheme = "border-amber-900 bg-amber-950/10";
                }

                return `
                    <div class="border ${borderTheme} p-6 rounded-xl transition duration-300 hover:scale-[1.01] hover:bg-zinc-900">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-white font-bold text-lg tracking-tight">${truck.truckId}</h3>
                                <p class="text-zinc-500 text-xs font-mono mt-0.5">Updated: ${new Date(truck.lastTimestamp).toLocaleTimeString()}</p>
                            </div>
                            ${statusBadge}
                        </div>
                        <div class="grid grid-cols-2 gap-4 mt-2">
                            <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800/60">
                                <span class="text-zinc-500 text-xs uppercase tracking-wider block mb-1 flex items-center gap-1"><i data-lucide="thermometer" class="w-3.5 h-3.5 text-zinc-400"></i> Temp</span>
                                <span class="text-xl font-semibold tracking-tight ${parseFloat(truck.currentTemperature) > 8.0 ? 'text-red-400 font-bold' : 'text-zinc-100'}">${truck.currentTemperature}°C</span>
                            </div>
                            <div class="bg-zinc-950 p-3 rounded-lg border border-zinc-800/60">
                                <span class="text-zinc-500 text-xs uppercase tracking-wider block mb-1 flex items-center gap-1"><i data-lucide="droplet" class="w-3.5 h-3.5 text-zinc-400"></i> Humidity</span>
                                <span class="text-xl font-semibold text-zinc-100 tracking-tight">${truck.currentHumidity}%</span>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-zinc-800/60 flex justify-between items-center text-sm font-mono text-zinc-400">
                            <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4 text-zinc-500"></i> ${parseFloat(truck.latitude).toFixed(4)}, ${parseFloat(truck.longitude).toFixed(4)}</span>
                            <span class="capitalize flex items-center gap-1"><i data-lucide="door-closed" class="w-4 h-4 text-zinc-500"></i> Vault: ${truck.doorStatus}</span>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderAlertsStream(alerts) {
            const container = document.getElementById('alerts-stream');
            if (alerts.length === 0) {
                container.innerHTML = `<p class="text-zinc-500 text-sm text-center py-8">Zero safety alerts logged in this operational window.</p>`;
                return;
            }

            container.innerHTML = alerts.map(alert => {
                const isCrit = alert.severity === 'CRITICAL';
                return `
                    <div class="flex gap-4 p-4 rounded-xl border ${isCrit ? 'bg-red-950/20 border-red-900/50' : 'bg-amber-950/10 border-amber-900/40'}">
                        <div class="rounded-lg p-2 h-9 w-9 flex items-center justify-center shrink-0 ${isCrit ? 'bg-red-900/30 text-red-400' : 'bg-amber-900/30 text-amber-400'}">
                            <i data-lucide="${isCrit ? 'octagon-alert' : 'triangle-alert'}" class="w-5 h-5"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-baseline">
                                <h4 class="text-white font-semibold text-sm truncate">${alert.truckId} • <span class="${isCrit ? 'text-red-400':'text-amber-400'}">${alert.anomalyType}</span></h4>
                                <span class="text-zinc-500 text-xs font-mono ml-2 shrink-0">${new Date(alert.timestamp).toLocaleTimeString()}</span>
                            </div>
                            <p class="text-zinc-400 text-sm mt-1 leading-relaxed">${alert.message}</p>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // Poll API endpoints every 4 seconds for real-time responsiveness
        setInterval(fetchDashboardData, 4000);
        window.onload = () => { fetchDashboardData(); };
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-zinc-800">

    <header class="border-b border-zinc-800 bg-zinc-900/40 sticky top-0 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 rounded-lg p-1.5 text-white shadow-md shadow-indigo-600/20">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight text-white">ChainGuard <span class="text-zinc-500 font-normal text-sm ml-1 font-mono">v1.0</span></h1>
            </div>
            <div class="flex items-center gap-2 text-xs font-mono text-emerald-400 bg-emerald-950/60 border border-emerald-900 px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> SYSTEM ONLINE (POLLING)
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-lg">
                <div class="flex items-center justify-between">
                    <span class="text-zinc-400 font-semibold text-sm uppercase tracking-wider">Fleet Assets Monitored</span>
                    <i data-lucide="truck" class="text-zinc-500 w-5 h-5"></i>
                </div>
                <div class="text-4xl font-extrabold tracking-tight mt-2 text-white" id="total-trucks">--</div>
            </div>
            
            <div id="critical-card" class="bg-zinc-900 border border-zinc-800 p-6 rounded-xl shadow-lg">
                <div class="flex items-center justify-between">
                    <span class="text-zinc-400 font-semibold text-sm uppercase tracking-wider">Active Critical Excursions</span>
                    <i data-lucide="activity" class="text-zinc-500 w-5 h-5"></i>
                </div>
                <div class="text-4xl font-extrabold tracking-tight mt-2 text-white" id="critical-count">--</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <h2 class="text-white font-bold text-xl tracking-tight mb-4 flex items-center gap-2">
                    <i data-lucide="radar" class="w-5 h-5 text-indigo-400"></i> Fleet Live Status Tracker 
                </h2>
                <div id="trucks-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>

            <div>
                <h2 class="text-white font-bold text-xl tracking-tight mb-4 flex items-center gap-2">
                    <i data-lucide="bell-ring" class="w-5 h-5 text-amber-400"></i> Incident Stream Ticker [cite: 17, 38, 42]
                </h2>
                <div id="alerts-stream" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                    </div>
            </div>

        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
